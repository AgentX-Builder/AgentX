[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx"
version = "0.1.0"
description = "Terminal AI Agent — local-first, Ollama/OpenAI-compatible, with dynamic tool generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU Affero General Public License v3.0 (AGPL-3.0)" }
keywords = ["ai", "agent", "cli", "llm", "ollama", "tools"]
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "httpx>=0.24",
    "requests>=2.28",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentx = "agentx.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
